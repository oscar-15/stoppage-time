name: Picks

on:
  schedule:
    # GitHub delays and drops scheduled runs on small repos, so ask often:
    # a run with nothing to do costs no credits (the bot decides when odds need refreshing).
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: cache
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Run bot
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_LEANS: ${{ vars.NOTIFY_LEANS || '0' }}
          REFRESH_HOURS: ${{ vars.REFRESH_HOURS || '8' }}
          PICKS_PER_DAY: ${{ vars.PICKS_PER_DAY || '10' }}
          MIN_EV: ${{ vars.MIN_EV || '0.03' }}
          STRATEGY: ${{ vars.STRATEGY || 'shop' }}
          SHOP_MIN_EV: ${{ vars.SHOP_MIN_EV || '0.02' }}
          LEAN_MIN_EV: ${{ vars.LEAN_MIN_EV || '0.005' }}
          LEANS_PER_DAY: ${{ vars.LEANS_PER_DAY || '10' }}
        run: python -m bot.run

      - name: Commit results
        run: |
          git config user.name "stoppage-time-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update picks $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
