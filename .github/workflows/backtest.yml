name: Backtest

on:
  push:
    branches: [main]
    paths: ["bot/**"]       # rerun whenever the model changes
  workflow_dispatch:
    inputs:
      seasons:
        description: "Past seasons to test"
        default: "3"
  schedule:
    - cron: "41 9 * * 1"       # Mondays, so the numbers stay current

permissions:
  contents: write

concurrency:
  group: picks
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore history cache
        uses: actions/cache@v4
        with:
          path: cache
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Run tests
        run: pip install pytest && python -m pytest -q tests

      - name: Backtest
        run: python -m bot.backtest --test-seasons ${{ github.event.inputs.seasons || 3 }}

      - name: Commit results
        run: |
          git config user.name "stoppage-time-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/backtest.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update backtest"
          git pull --rebase
          git push
